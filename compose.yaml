services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SITE_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      TRUST_PROXY: "1"
      HOST: 0.0.0.0
      TZ: Asia/Shanghai
    volumes:
      - wall_data:/app/data
    networks: [backend]
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [backend,web]
volumes:
  wall_data:
  caddy_data:
  caddy_config:
networks:
  backend:
    internal: true
  web:
